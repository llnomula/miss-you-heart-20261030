<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f2">
  <meta name="description" content="没有特别的事，就是特别想你。送你一颗会跳动的心。">
  <title>想你了，送你一颗心 ♡</title>
  <style>
    :root { color-scheme: light; --ink: #713e43; --rose: #d85b70; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #fff5f2; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; overflow-x: hidden; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color: transparent; background: radial-gradient(ellipse at 50% 38%, #ffe1e1 0, #fff1eb 42%, #fff9f5 85%); }
    button { font: inherit; }
    .page { position: relative; isolation: isolate; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 38px 24px 30px; overflow: hidden; }
    .page::before { content: ""; position: absolute; inset: 16px; z-index: -1; border: 1px solid #d9a5a44a; border-radius: 180px 180px 18px 18px; pointer-events: none; }
    .orb { position: absolute; width: 290px; height: 290px; border-radius: 50%; background: #ed9b9b16; filter: blur(3px); z-index: -2; }
    .orb.one { top: -100px; right: -170px; }
    .orb.two { bottom: -180px; left: -110px; width: 380px; height: 380px; }
    main { width: 100%; max-width: 460px; text-align: center; }
    .eyebrow { display: inline-flex; gap: 10px; align-items: center; font-size: 10px; letter-spacing: 3px; color: #a57578; margin: 8px 0 31px; }
    .eyebrow::before, .eyebrow::after { content: ""; display: block; width: 27px; height: 1px; background: #c68f8f65; }
    .prelude { margin: 0 0 10px; color: #a17376; font-size: 13px; letter-spacing: 3px; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: clamp(49px, 12vw, 66px); font-weight: 500; letter-spacing: 9px; line-height: 1.35; text-indent: 9px; }
    .heart-stage { position: relative; width: 260px; height: 247px; margin: 8px auto 0; display: grid; place-items: center; }
    .ring { position: absolute; width: 205px; height: 205px; border: 1px solid #dba4a441; border-radius: 50%; }
    .ring::after { content: ""; position: absolute; inset: -16px; border: 1px dashed #dba4a42e; border-radius: 50%; }
    .heart-button { position: relative; display: grid; place-items: center; width: 192px; height: 188px; padding: 12px 8px; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
    .heart-button:focus-visible { outline: 2px solid var(--rose); outline-offset: 5px; border-radius: 42%; }
    .heart-svg { width: 176px; height: 166px; overflow: visible; filter: drop-shadow(0 16px 20px #bd526938); animation: heartbeat 2.2s ease-in-out infinite; }
    .heart-button.popped .heart-svg { animation: pop .6s ease-out; }
    .heart-word { position: absolute; top: 77px; left: 0; width: 100%; color: #fff8f4; font-family: "Songti SC", "STSong", serif; font-size: 24px; letter-spacing: 5px; text-indent: 5px; pointer-events: none; text-shadow: 0 1px 6px #b14b6255; }
    .spark { position: absolute; color: #d8a1a2; font-size: 20px; animation: float 4s ease-in-out infinite; pointer-events: none; }
    .spark.a { left: 14px; top: 69px; font-size: 25px; }
    .spark.b { right: 13px; top: 36px; animation-delay: -1s; }
    .spark.c { right: 22px; bottom: 37px; font-size: 27px; animation-delay: -2s; }
    .spark.d { left: 35px; bottom: 33px; font-size: 13px; animation-delay: -3s; }
    .poem { margin: -1px 0 0; font-size: 16px; line-height: 2.1; letter-spacing: 3px; }
    .poem strong { font-weight: 500; color: #c05b70; }
    .hint { margin: 21px 0 0; color: #b68a8e; font-size: 11px; letter-spacing: 2px; }
    .divider { width: 28px; height: 1px; background: #ce979775; margin: 25px auto 17px; }
    .note { min-height: 40px; margin: 0; font-size: 12px; line-height: 1.8; color: #a97b80; letter-spacing: 1px; }
    footer { margin-top: 23px; color: #bd9598; font-size: 9px; letter-spacing: 3px; }
    .flying-heart { position: fixed; z-index: 10; pointer-events: none; user-select: none; color: var(--heart-color); left: var(--x); top: var(--y); font-family: Georgia, serif; font-size: var(--size); line-height: 1; animation: fly var(--duration) cubic-bezier(.18,.6,.42,1) forwards; }
    .ambient { position: absolute; z-index: -1; color: #d99c9c; opacity: 0; font-family: Georgia, serif; animation: drift var(--duration) linear infinite; animation-delay: var(--delay); pointer-events: none; }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.07); } 23% { transform: scale(1); } 34% { transform: scale(1.04); } 46% { transform: scale(1); } }
    @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.16) rotate(-5deg); } 65% { transform: scale(.97) rotate(3deg); } 100% { transform: scale(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-8deg); opacity: .6; } 50% { transform: translateY(-7px) rotate(8deg); opacity: 1; } }
    @keyframes fly { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 12% { opacity: 1; } 75% { opacity: .85; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rotation)) scale(1.15); } }
    @keyframes drift { 0% { opacity: 0; transform: translateY(40px) rotate(-15deg); } 15%, 75% { opacity: .17; } 100% { opacity: 0; transform: translateY(-180px) rotate(20deg); } }
    @media (max-height: 740px) { .page { padding-top: 30px; padding-bottom: 26px; } .eyebrow { margin-bottom: 22px; } .heart-stage { height: 223px; } .divider { margin-top: 20px; } footer { margin-top: 15px; } }
    @media (max-width: 350px) { .page { padding-left: 20px; padding-right: 20px; } .poem { font-size: 14px; } .prelude { font-size: 12px; } }
    @media (min-width: 700px) { .page::before { inset: 26px; border-radius: 20px; } .eyebrow { margin-bottom: 36px; } .heart-stage { margin-top: 17px; height: 265px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .flying-heart { display: none; } }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div class="orb one" aria-hidden="true"></div>
    <div class="orb two" aria-hidden="true"></div>
    <main>
      <div class="eyebrow">一份小小的心意</div>
      <p class="prelude">有句话，想现在告诉你</p>
      <h1>想你了。</h1>
      <div class="heart-stage">
        <div class="ring" aria-hidden="true"></div>
        <span class="spark a" aria-hidden="true">✧</span>
        <span class="spark b" aria-hidden="true">♡</span>
        <span class="spark c" aria-hidden="true">✧</span>
        <span class="spark d" aria-hidden="true">♡</span>
        <button class="heart-button" id="heartButton" type="button" aria-label="收下这颗心，让爱心绽放">
          <svg class="heart-svg" viewBox="0 0 200 185" aria-hidden="true">
            <defs>
              <linearGradient id="heartFill" x1=".15" y1="0" x2=".85" y2="1" gradientUnits="objectBoundingBox">
                <stop offset="0" stop-color="#f9a6ae"/>
                <stop offset=".48" stop-color="#e8778c"/>
                <stop offset="1" stop-color="#cd526e"/>
              </linearGradient>
              <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
                <stop stop-color="#ffffff" stop-opacity=".5"/>
                <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="M100 174 C83 159 13 112 9 68 C5 29 48 6 78 29 C88 36 95 45 100 53 C106 42 117 30 130 25 C166 10 198 37 191 74 C184 116 119 161 100 174Z" fill="url(#heartFill)"/>
            <path d="M25 63 C25 39 49 24 69 36" fill="none" stroke="url(#shine)" stroke-width="7" stroke-linecap="round"/>
          </svg>
          <span class="heart-word" aria-hidden="true">给你</span>
        </button>
      </div>
      <p class="poem">没有特别的事，<br>就是<strong>特别想你。</strong></p>
      <p class="hint">轻轻点一下爱心，收下我的想念</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="note" id="note" aria-live="polite">隔着屏幕，也想抱抱你。</p>
      <footer>♡ &nbsp; 把心意，送到你身边 &nbsp; ♡</footer>
    </main>
  </div>
  <script>
    const heartButton = document.getElementById('heartButton');
    const note = document.getElementById('note');
    const page = document.getElementById('page');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const messages = [
      '这颗心，偏偏只为你跳动。',
      '想把今天的第一份温柔，留给你。',
      '如果想念有声音，你一定听得见。',
      '忙归忙，想你这件事一直没忘。',
      '等见面了，要好好抱抱你。',
      '今天想你，明天也会。'
    ];
    const colors = ['#cf536f', '#e77e91', '#f4a7b4', '#d88e98', '#c3627a'];
    let clickCount = 0;
    let lastBurst = 0;
    let popTimer;

    // 在点击位置散开小爱心，动画结束后清理元素。
    function createHearts(x, y, amount) {
      if (reducedMotion.matches) return;
      const currentCount = document.querySelectorAll('.flying-heart').length;
      const available = Math.max(0, Math.min(amount, 72 - currentCount));
      for (let i = 0; i < available; i++) {
        const heart = document.createElement('span');
        heart.className = 'flying-heart';
        heart.textContent = i % 3 === 0 ? '♡' : '♥';
        heart.setAttribute('aria-hidden', 'true');
        heart.style.setProperty('--x', x + 'px');
        heart.style.setProperty('--y', y + 'px');
        heart.style.setProperty('--dx', (Math.random() - .5) * 280 + 'px');
        heart.style.setProperty('--dy', -(80 + Math.random() * 240) + 'px');
        heart.style.setProperty('--size', (13 + Math.random() * 24) + 'px');
        heart.style.setProperty('--rotation', (Math.random() - .5) * 100 + 'deg');
        heart.style.setProperty('--duration', (1.3 + Math.random() * .8) + 's');
        heart.style.setProperty('--heart-color', colors[Math.floor(Math.random() * colors.length)]);
        document.body.appendChild(heart);
        heart.addEventListener('animationend', () => heart.remove(), { once: true });
        window.setTimeout(() => heart.remove(), 2300);
      }
    }

    heartButton.addEventListener('click', () => {
      const now = performance.now();
      if (now - lastBurst < 180) return;
      lastBurst = now;
      note.textContent = messages[clickCount % messages.length];
      clickCount++;
      heartButton.classList.remove('popped');
      void heartButton.offsetWidth;
      heartButton.classList.add('popped');
      window.clearTimeout(popTimer);
      popTimer = window.setTimeout(() => heartButton.classList.remove('popped'), 650);
      const bounds = heartButton.getBoundingClientRect();
      createHearts(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2, 22);
    });

    // 点击页面空白处，也会飘出几颗小爱心。
    page.addEventListener('click', (event) => {
      if (event.target.closest('button')) return;
      createHearts(event.clientX, event.clientY, 5);
    });

    // 背景只使用少量元素，不依赖图片、音乐或外部资源。
    for (let i = 0; i < 7; i++) {
      const heart = document.createElement('span');
      heart.className = 'ambient';
      heart.textContent = '♡';
      heart.setAttribute('aria-hidden', 'true');
      heart.style.left = (8 + Math.random() * 84) + '%';
      heart.style.top = (20 + Math.random() * 70) + '%';
      heart.style.fontSize = (15 + Math.random() * 17) + 'px';
      heart.style.setProperty('--duration', (9 + Math.random() * 6) + 's');
      heart.style.setProperty('--delay', -(Math.random() * 15) + 's');
      page.appendChild(heart);
    }
  </script>
</body>
</html>
